name: Plumber

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  plumber:
    name: Plumber - CI/CD Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Plumber
        uses: getplumber/plumber@d3536bae4727b9290d9e69ee25c4350ddbcd91cd # v1
        with:
          sarif: plumber-results.sarif
          output: plumber-results.json
          pbom-cyclonedx: plumber-pbom.cdx.json
          upload-sarif: false
          upload-artifacts: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        if: always() && hashFiles('plumber-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: plumber-results.sarif
          category: plumber

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('plumber-results.json') != ''
        with:
          name: plumber-report
          path: |
            plumber-results.json
            plumber-results.sarif
            plumber-pbom.cdx.json
          retention-days: 30

      - name: Plumber Gate (conformite >= 90% requise)
        if: hashFiles('plumber-results.json') != ''
        run: |
          SCORE=$(jq '.compliance' plumber-results.json)
          echo "Plumber compliance: ${SCORE}%"
          if [ "$SCORE" -lt 90 ]; then
            echo "::error::Plumber compliance ${SCORE}% < 90% (security gate)"
            exit 1
          fi
