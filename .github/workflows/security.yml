name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Lundi 6h UTC

permissions: read-all

jobs:
  # -----------------------------------------
  # SECRETS — Gitleaks
  # -----------------------------------------
  gitleaks:
    name: Gitleaks - Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks
        # Skip pour les PR Dependabot : GitHub ne transmet pas les secrets du dépôt aux workflows
        # déclenchés par Dependabot (secrets.GITLEAKS_LICENCE_KEY est vide), donc gitleaks-action
        # — qui exige une licence pour les organisations — échoue systématiquement. Un bump de
        # dépendance ne peut de toute façon pas introduire de secret. Le job reste présent (le
        # check requis passe au vert), seul le scan est sauté pour cet acteur.
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENCE_KEY }}
