name: Docs Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: read-all

jobs:
  lint-and-build:
    name: Lint + build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PNG diagrams from PlantUML sources
        run: |
          wget -q "https://github.com/plantuml/plantuml/releases/download/v1.2024.8/plantuml-1.2024.8.jar" -O /tmp/plantuml.jar
          find docs -name "*.puml" | while IFS= read -r f; do
            echo "→ Generating: $f"
            java -jar /tmp/plantuml.jar -tpng "$f" && echo "  ✓ ${f%.puml}.png" || echo "  ✗ FAILED: $f"
          done
          echo "=== Generated PNGs ===" && find docs -name "*.png" || true

      - name: Lint markdown (structure)
        run: npm run lint:md

      - name: Lint spelling (FR + termes techniques)
        run: npm run lint:spelling

      - name: Lint nomenclature backlog/ADR
        run: npm run lint:naming

      - name: Lint taxonomie des rôles (champ Rôle:)
        run: npm run lint:taxonomie

      - name: "Build (échoue sur lien cassé — onBrokenLinks: throw)"
        run: npm run build
